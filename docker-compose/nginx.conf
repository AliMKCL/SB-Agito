events { worker_connections 1024; }

http {
    server {
        listen 443 ssl;
        server_name localhost;

        # Paths to the certificates inside the Nginx container
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            # Forward whatever we get to keycloak.
            proxy_pass http://keycloak:8080;

            # Forward the original headers to Keycloak
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;      # Tells Keycloak the client used HTTPS
            proxy_set_header X-Forwarded-Port 8443;       # The external port the client hit

            # Needed for Keycloak WebSockets / Administration console
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
