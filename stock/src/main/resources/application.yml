server:
  port: 8090

spring:
  application:
    name: "stock"
  datasource:
    url: jdbc:mysql://stockDB:3306/stockDB
    username: root
    password: root
  sql:
    init:
      mode: always
  jpa:
    show-sql: true  # Displays the sql that is run behind the scenes by jdbc.
  config:
    import: "optional:file:.env[.properties]"

  cloud:
    loadbalancer:
      cache:
        enabled: true # Disables the load balancer using the cache (for debugging stuck at no instance error)
    function:
      definition: createNewProduct;deleteProduct;editProduct
    stream:
      bindings:
        createNewProduct-in-0: # Receives event when product-service creates a product.
          destination: start-product-created
        confirmNewProduct-out-0: # Sends an event when stock service creates the product in its database.
          destination: finish-product-created
          group: ${spring.application.name}
        deleteProduct-in-0:
          destination: start-product-deleted
        confirmDeleteProduct-out-0:
          destination: finish-product-deleted
          group: ${spring.application.name}
        editProduct-in-0:
          destination: start-product-edited
        confirmEditProduct-out-0:
          destination: finish-product-edited
          group: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted  # Allows graceful shutdown of microservice.
  info: # Enable information related environment variables.
    env:
      enabled: true
endpoints:
  shutdown:
    enabled: true

eureka:
  instance:
    preferIpAddress: true # Whenever MS registers to the Eureka S. Make it register via IP (not hostname default).
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

# Info on the Eureka Dashboard
info:
  app:
    name: "stock"
    description: "Ecommerce Application"
    version: "1.0.0"


