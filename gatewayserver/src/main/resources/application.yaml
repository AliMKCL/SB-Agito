server:
  port: 9000

spring:
  application:
    name: gatewayserver
  config:
    import:
    - "optional:configserver:"      # Needed to stop an error.
    - "optional:file:.env[.properties]"

  # Allow the codec to buffer up to 20 MB in memory.
  # Without this Spring WebFlux rejects multipart/form-data requests
  # at the codec level (before the controller runs) with HTTP 415.
  codec:
    max-in-memory-size: 20MB


  cloud:
    gateway:
      default-filters:
        - TokenRelay
      server:
        webflux:
          discovery:
            locator:
              enabled: true # Route based on information inside eurakaserver Service Registry.
              lowerCaseServiceId: true

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: gatewayserver
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            # Browser redirects here:
            authorization-uri: https://localhost:8443/realms/master/protocol/openid-connect/auth
            # Backend exchanges codes and fetches JWKs here:
            token-uri: http://keycloak:8080/realms/master/protocol/openid-connect/token
            jwk-set-uri: http://keycloak:8080/realms/master/protocol/openid-connect/certs
            user-info-uri: http://keycloak:8080/realms/master/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          jwk-set-uri: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/

clamav:
  host: ${CLAMAV_HOST:localhost}
  port: ${CLAMAV_PORT:3310}

logging:
  level:
    # Logs every step of the file upload and inspection pipeline
    com.staj.gatewayserver.controller: DEBUG
    com.staj.gatewayserver.service: DEBUG
    # Logs Spring Security decisions: who is authenticated, why 401/403 is returned,
    # which filter rejected the request, and JWT validation failure reasons
    org.springframework.security: DEBUG
    # Logs Spring's codec / multipart decisions (useful for diagnosing 415 errors)
    org.springframework.http.codec.multipart: DEBUG
    # Logs WebClient requests sent internally by Spring Cloud Gateway routing
    org.springframework.web.reactive.function.client: DEBUG
