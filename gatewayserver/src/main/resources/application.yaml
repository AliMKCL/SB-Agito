server:
  port: 9000

spring:
  application:
    name: gatewayserver
  config:
    import:
    - "optional:configserver:"      # Needed to stop an error.
    - "optional:file:.env[.properties]"


  cloud:
    gateway:
      default-filters:
        - TokenRelay
      server:
        webflux:
          discovery:
            locator:
              enabled: true # Route based on information inside eurakaserver Service Registry.
              lowerCaseServiceId: true

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: gatewayserver
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            # Browser redirects here:
            authorization-uri: https://localhost:8443/realms/master/protocol/openid-connect/auth
            # Backend exchanges codes and fetches JWKs here:
            token-uri: http://keycloak:8080/realms/master/protocol/openid-connect/token
            jwk-set-uri: http://keycloak:8080/realms/master/protocol/openid-connect/certs
            user-info-uri: http://keycloak:8080/realms/master/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8000/realms/master/protocol/openid-connect/certs"


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
